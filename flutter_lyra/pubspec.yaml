name: flutter_lyra
description: Internal Zencillo Flutter integration for the Lyra Android and iOS SDKs.

publish_to: none

version: 0.7.1

environment:
  sdk: ">=3.3.3 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_lyra_android
      ios:
        default_package: flutter_lyra_ios

dependencies:
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_lyra_android: ^0.7.1
  flutter_lyra_ios: ^0.7.1
  flutter_lyra_platform_interface: ^0.7.1

dev_dependencies:
  analyzer: ^4.7.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.1
  plugin_platform_interface: ^2.0.0
